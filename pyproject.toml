[project]
name = "supermimic-mjlab"
version = "0.1.0"
description = "SuperMimic (arXiv 2610.28480) reproduction on mjlab / MuJoCo-Warp."
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab",
  "matplotlib",
  "imageio-ffmpeg",
  "pandas",
]

[tool.uv]
package = false

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "f135c1daa0f278bd19e323c2b9f256ca541ae2c5" }
